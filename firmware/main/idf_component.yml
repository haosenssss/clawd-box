dependencies:
  idf: ">=5.5"

  # ST7701 面板驱动。版本对齐出货固件（xiaozhi v1.8.5）所用，避免 API 漂移。
  espressif/esp_lcd_st7701: "^2.0.2"

  # TCA9554 IO 扩展器——本板的 LCD 复位和 ST7701 的 3-wire SPI 都挂在它后面
  espressif/esp_io_expander_tca9554: "~2.0.3"

  # 提供 esp_lcd_new_panel_io_3wire_spi：把 SPI 时序打在 IO 扩展器引脚上
  espressif/esp_lcd_panel_io_additions: "^1.0.1"

  # 音频：ES8311 编解码器。用官方组件而不是自己抄寄存器序列——
  # 那串初始化序列出一点错就是"没声音"，没有中间态可查。
  espressif/esp_codec_dev: "^1.3.4"
